<section class="hero">

    <div class="hero-slider__slider">
        <div class="slider-hero__body swiper">

                style='background: url("@img/1126x515.png") 50% 50% / cover no-repeat;'>
                <h2>
                    Fii parte din istoria sănătoasă a copilului tău. Protejează-l prin vaccinare!
                </h2>
                <button class='button button__blue'>

    <div class="hero__content hero__content-left">
        @@include('../cards/calendar-card.html')

    <!-- Info Cards and Slider Block Right -->
    <div class="hero__content hero__content-right">
        @@include('../cards/ansp-card.html')
